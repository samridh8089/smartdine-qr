<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dishBg" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="150" y1="80" x2="250" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="160" y1="90" x2="240" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="300" fill="url(#dishBg)" />

  <!-- Subtle Ambient Glow Circle -->
  <circle cx="200" cy="130" r="90" fill="url(#accentGlow)" />

  <!-- Plate Base Ring -->
  <ellipse cx="200" cy="145" rx="72" ry="24" stroke="#334155" stroke-width="3" fill="#1e293b" fill-opacity="0.5" />
  <ellipse cx="200" cy="142" rx="56" ry="18" stroke="#10b981" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="4 3" />

  <!-- Cloche / Food Cover Dome -->
  <path d="M152 140 C152 95, 248 95, 248 140 Z" fill="url(#emeraldGrad)" fill-opacity="0.15" stroke="url(#emeraldGrad)" stroke-width="3" stroke-linecap="round" />
  
  <!-- Cloche Handle -->
  <circle cx="200" cy="92" r="7" fill="#10b981" />
  <path d="M197 99 L195 106 H205 L203 99 Z" fill="#10b981" />

  <!-- Steam Arcs -->
  <path d="M185 75 C182 68, 187 62, 185 55" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7" />
  <path d="M200 70 C197 63, 203 57, 200 50" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9" />
  <path d="M215 75 C218 68, 213 62, 215 55" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7" />

  <!-- Cutlery Accents -->
  <!-- Left Fork -->
  <g transform="translate(112, 110)" stroke="#64748b" stroke-width="2.5" stroke-linecap="round">
    <line x1="12" y1="5" x2="12" y2="45" />
    <path d="M6 5 L6 16 C6 21, 18 21, 18 16 L18 5" fill="none" />
    <line x1="12" y1="5" x2="12" y2="17" />
  </g>

  <!-- Right Spoon -->
  <g transform="translate(264, 110)" stroke="#64748b" stroke-width="2.5" stroke-linecap="round">
    <line x1="12" y1="18" x2="12" y2="45" />
    <ellipse cx="12" cy="11" rx="6" ry="9" fill="none" />
  </g>

  <!-- Branded Badge -->
  <g transform="translate(200, 215)">
    <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <circle cx="-46" cy="0" r="4.5" fill="#10b981" />
    <text x="-34" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#f8fafc" letter-spacing="0.5">CleverOps</text>
  </g>

  <!-- Subtle Subtext -->
  <text x="200" y="252" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#64748b" letter-spacing="2">CHEF SPECIAL SELECTION</text>
</svg>
